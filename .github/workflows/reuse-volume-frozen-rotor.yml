name: Frozen Rotor fresh MRF from independently reverified HXT volume

on:
  workflow_dispatch:
    inputs:
      volume_run_id:
        description: Completed extended HXT run with its actual volume step successful
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: frozen-rotor-reused-volume-baseline
  cancel-in-progress: false

jobs:
  baseline:
    name: FREE fresh MRF after actual source volume replay
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VOLUME_RUN_ID: ${{ inputs.volume_run_id }}
      PIP_CONFIG_FILE: /dev/null
      PIP_INDEX_URL: https://pypi.org/simple
      PIP_EXTRA_INDEX_URL: ''
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - name: Check out the independent public repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the exact public FREE runner and bounded source ID
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/public_runner_guard.py
          python3 -B tools/reuse_volume_workflow_preflight.py
      - name: Set up CPython 3.12.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
      - name: Install the isolated pinned contract and source readers
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install --no-install-recommends -y libglu1-mesa
          python -m venv "$RUNNER_TEMP/volume-reader"
          "$RUNNER_TEMP/volume-reader/bin/python" -m pip install --only-binary=:all: --index-url https://pypi.org/simple h5py==3.16.0 numpy==2.5.4 gmsh==4.15.2
          "$RUNNER_TEMP/volume-reader/bin/python" -m pip check
      - name: Verify source transfer and engineering contracts
        run: '"$RUNNER_TEMP/volume-reader/bin/python" -B -m unittest discover -s tests -v'
      - name: Admit only the exact completed source volume step and raw artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/simcalc/PyAnsys/actions/runs/$VOLUME_RUN_ID" > "$RUNNER_TEMP/source-run.json"
          gh api "repos/simcalc/PyAnsys/actions/runs/$VOLUME_RUN_ID/jobs" > "$RUNNER_TEMP/source-jobs.json"
          gh api "repos/simcalc/PyAnsys/actions/runs/$VOLUME_RUN_ID/artifacts" > "$RUNNER_TEMP/source-artifacts.json"
          "$RUNNER_TEMP/volume-reader/bin/python" -B tools/reuse_volume_workflow_preflight.py \
            --run-json "$RUNNER_TEMP/source-run.json" --jobs-json "$RUNNER_TEMP/source-jobs.json" \
            --artifacts-json "$RUNNER_TEMP/source-artifacts.json" > "$RUNNER_TEMP/source-admission.json"
          cat "$RUNNER_TEMP/source-admission.json"
          "$RUNNER_TEMP/volume-reader/bin/python" -B - <<'PY'
          import json, os, resource, subprocess
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          admitted = json.loads((root / 'source-admission.json').read_text())
          resource.setrlimit(resource.RLIMIT_FSIZE, (300 * 1024**2, 300 * 1024**2))
          with (root / 'source-volume-artifact.zip').open('xb') as stream:
              subprocess.run(['gh', 'api', 'repos/simcalc/PyAnsys/actions/artifacts/' + str(admitted['artifactId']) + '/zip'],
                             stdout=stream, check=True, timeout=300)
          PY
      - name: Replay actual topology and pinned source boundaries without remeshing
        env:
          PYANSYS_PUBLIC_REPOSITORY_VISIBILITY: public
        shell: bash
        run: |
          set -euo pipefail
          sudo --preserve-env=PATH,GITHUB_ACTIONS,GITHUB_REPOSITORY,PYANSYS_PUBLIC_REPOSITORY_VISIBILITY,GITHUB_EVENT_NAME,RUNNER_OS,RUNNER_ENVIRONMENT,GITHUB_SHA,GITHUB_RUN_ID,RUNNER_TEMP \
            systemd-run --scope --unit="frozen-volume-replay-${GITHUB_RUN_ID}" \
            -p MemoryMax=4294967296 -p MemorySwapMax=0 -p CPUQuota=100% -p TasksMax=32 \
            /usr/bin/timeout --kill-after=10s 330s \
            "$RUNNER_TEMP/volume-reader/bin/python" -B tools/frozen_rotor_volume_source.py \
            --archive "$RUNNER_TEMP/source-volume-artifact.zip" \
            --admission-json "$RUNNER_TEMP/source-admission.json" \
            --output-directory "$RUNNER_TEMP/frozen-volume-source"
      - name: Install checksum-pinned OpenFOAM Foundation 12
        run: bash tools/install_openfoam12.sh
      - name: Convert and execute a fresh bounded native MRF baseline
        shell: bash
        run: |
          set -euo pipefail
          set +eu
          source /opt/openfoam12/etc/bashrc
          foam_source_status=$?
          set -euo pipefail
          test "$foam_source_status" -eq 0
          test "${WM_PROJECT_VERSION:-}" = 12
          foam_library_path="${LD_LIBRARY_PATH:-}"
          test -n "$foam_library_path"
          sudo --preserve-env=PATH,LD_LIBRARY_PATH,WM_PROJECT_VERSION,WM_PROJECT_DIR,FOAM_LIBBIN,FOAM_APPBIN,FOAM_ETC,GITHUB_ACTIONS,GITHUB_SHA,GITHUB_RUN_ID,RUNNER_TEMP \
            systemd-run --scope --unit="frozen-pump-reused-${GITHUB_RUN_ID}" \
            -p MemoryMax=2147483648 -p MemorySwapMax=0 -p CPUQuota=100% -p TasksMax=32 \
            /usr/bin/timeout --kill-after=10s 1230s \
            /usr/bin/env "LD_LIBRARY_PATH=$foam_library_path" \
            "$RUNNER_TEMP/volume-reader/bin/python" -B tools/run_frozen_rotor_openfoam.py \
            --mesh-directory "$RUNNER_TEMP/frozen-volume-source" \
            --output-directory "$RUNNER_TEMP/frozen-openfoam-case"
      - name: Require independent actual preliminary baseline numerical acceptance
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/volume-reader/bin/python" -B tools/frozen_rotor_native_reduction.py \
            --execution-directory "$RUNNER_TEMP/frozen-openfoam-case" \
            > "$RUNNER_TEMP/frozen-openfoam-case/reused-native-baseline-recheck.json"
          cat "$RUNNER_TEMP/frozen-openfoam-case/reused-native-baseline-recheck.json"
      - name: Retain separate volume transfer and actual new native evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frozen-rotor-reused-volume-baseline-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/frozen-volume-source/remesh-report.json
            ${{ runner.temp }}/frozen-volume-source/impeller.msh
            ${{ runner.temp }}/frozen-volume-source/volute.msh
            ${{ runner.temp }}/frozen-volume-source/volume-transfer.json
            ${{ runner.temp }}/frozen-openfoam-case/openfoam-preparation.json
            ${{ runner.temp }}/frozen-openfoam-case/openfoam-execution.json
            ${{ runner.temp }}/frozen-openfoam-case/openfoam-acceptance.json
            ${{ runner.temp }}/frozen-openfoam-case/runtime-identity.json
            ${{ runner.temp }}/frozen-openfoam-case/geometry-identity.json
            ${{ runner.temp }}/frozen-openfoam-case/native-input-manifest.json
            ${{ runner.temp }}/frozen-openfoam-case/classroom-study.json
            ${{ runner.temp }}/frozen-openfoam-case/native-baseline-reduction.json
            ${{ runner.temp }}/frozen-openfoam-case/reused-native-baseline-recheck.json
            ${{ runner.temp }}/frozen-openfoam-case/native-case-evidence.zip
            ${{ runner.temp }}/frozen-openfoam-case/native-case-evidence.json
            ${{ runner.temp }}/frozen-openfoam-case/logs/*.log
          if-no-files-found: error
          retention-days: 1
      - name: Retain separate actual mesh diagnostics even when quality rejects
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frozen-rotor-reused-volume-mesh-diagnostics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/frozen-openfoam-case/impeller-case/constant/polyMesh/
            ${{ runner.temp }}/frozen-openfoam-case/volute-case/constant/polyMesh/
            ${{ runner.temp }}/frozen-openfoam-case/logs/*.log
          if-no-files-found: warn
          retention-days: 1
