name: Install and verify PyFluent SDK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pyfluent-sdk-installation
  cancel-in-progress: false

jobs:
  install:
    name: FREE public runner SDK installation
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      PIP_CONFIG_FILE: /dev/null
      PIP_INDEX_URL: https://pypi.org/simple
      PIP_EXTRA_INDEX_URL: ""
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out this independent repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require the public standard GitHub runner
        run: python3 -B tools/public_runner_guard.py
      - name: Set up CPython 3.12.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
      - name: Check isolation and evidence contracts
        run: python -B -m unittest discover -s tests -v
      - name: Download official SDK and required binary dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/pyfluent-sdk"
          "$RUNNER_TEMP/pyfluent-sdk/bin/python" -m pip download --only-binary=:all: --index-url https://pypi.org/simple --dest "$RUNNER_TEMP/pyfluent-wheels" -r requirements.txt
      - name: Install SDK into the isolated runner environment
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/pyfluent-sdk/bin/python" -m pip install --no-index --find-links "$RUNNER_TEMP/pyfluent-wheels" -r requirements.txt
          "$RUNNER_TEMP/pyfluent-sdk/bin/python" -m pip check
          "$RUNNER_TEMP/pyfluent-sdk/bin/python" -B tools/verify_sdk.py --output "$RUNNER_TEMP/pyfluent-release/sdk-verification.json"
      - name: Build checksummed downloadable SDK bundle
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/pyfluent-sdk/bin/python" -B tools/build_bundle.py --wheels "$RUNNER_TEMP/pyfluent-wheels" --output "$RUNNER_TEMP/pyfluent-release"
      - name: Actually install and verify the downloadable offline bundle
        run: python -B tools/verify_bundle.py --directory "$RUNNER_TEMP/pyfluent-release"
      - name: Publish and verify software release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B tools/publish_release.py --directory "$RUNNER_TEMP/pyfluent-release"
