name: Frozen Rotor native cavitation or sliding transient

on:
  workflow_dispatch:
    inputs:
      baseline_run_id:
        description: Completed qualified native MRF evidence run in this public repository
        required: true
        type: string
      mode:
        description: Fixed MRF phase relaxation or true sliding mesh
        required: true
        type: choice
        default: steady-sweep
        options:
          - steady-sweep
          - transient-sliding
      pressure_absolute_pa:
        description: Inlet absolute total pressure in Pa; use a high-pressure phase H0 first
        required: true
        type: string
        default: '101325'
      time_step_s:
        description: Maximum physical time step in seconds; actual Courant limits still apply
        required: true
        type: string
        default: '0.0001'
      duration_s:
        description: Physical duration in seconds, between four and ten rotor revolutions
        required: true
        type: string
        default: '0.3'

permissions:
  contents: read
  actions: read

concurrency:
  group: frozen-rotor-native-phase
  cancel-in-progress: false

jobs:
  phase:
    name: FREE public native phase execution
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      BASELINE_RUN_ID: ${{ inputs.baseline_run_id }}
      PHASE_MODE: ${{ inputs.mode }}
      PRESSURE_ABSOLUTE_PA: ${{ inputs.pressure_absolute_pa }}
      TIME_STEP_S: ${{ inputs.time_step_s }}
      DURATION_S: ${{ inputs.duration_s }}
    steps:
      - name: Check out the independent public repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the exact public FREE runner and physical inputs
        run: |
          python3 -B tools/public_runner_guard.py
          python3 -B tools/phase_workflow_preflight.py
      - name: Set up CPython 3.12.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
      - name: Inspect and download only the admitted native baseline artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/simcalc/PyAnsys/actions/runs/$BASELINE_RUN_ID" > "$RUNNER_TEMP/source-run.json"
          gh api "repos/simcalc/PyAnsys/actions/runs/$BASELINE_RUN_ID/artifacts" > "$RUNNER_TEMP/source-artifacts.json"
          python -B tools/phase_workflow_preflight.py --run-json "$RUNNER_TEMP/source-run.json" --artifacts-json "$RUNNER_TEMP/source-artifacts.json"
          gh run download "$BASELINE_RUN_ID" --repo simcalc/PyAnsys --name "frozen-rotor-remesh-$BASELINE_RUN_ID" --dir "$RUNNER_TEMP/source-artifact"
      - name: Install checksum-pinned OpenFOAM Foundation 12
        run: bash tools/install_openfoam12.sh
      - name: Verify the exact transferred native bytes and baseline qualification
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/unpack_native_pump_package.py \
            --archive "$RUNNER_TEMP/source-artifact/frozen-openfoam-case/native-case-evidence.zip" \
            --manifest "$RUNNER_TEMP/source-artifact/frozen-openfoam-case/native-case-evidence.json" \
            --output-directory "$RUNNER_TEMP/frozen-baseline"
      - name: Prepare and execute the bounded native phase case
        shell: bash
        run: |
          set -euo pipefail
          set +eu
          source /opt/openfoam12/etc/bashrc
          foam_source_status=$?
          set -euo pipefail
          test "$foam_source_status" -eq 0
          test "${WM_PROJECT_VERSION:-}" = 12
          python_path="$(command -v python)"
          foam_library_path="${LD_LIBRARY_PATH:-}"
          test -n "$foam_library_path"
          sudo --preserve-env=PATH,LD_LIBRARY_PATH,WM_PROJECT_VERSION,WM_PROJECT_DIR,FOAM_LIBBIN,FOAM_APPBIN,FOAM_ETC,GITHUB_ACTIONS,GITHUB_REPOSITORY,GITHUB_EVENT_NAME,RUNNER_OS,RUNNER_ENVIRONMENT,GITHUB_SHA,GITHUB_RUN_ID,RUNNER_TEMP \
            systemd-run --scope --unit="frozen-phase-${GITHUB_RUN_ID}" \
            -p MemoryMax=2147483648 -p MemorySwapMax=0 -p CPUQuota=100% -p TasksMax=32 \
            /usr/bin/timeout --kill-after=10s 1230s \
            /usr/bin/env "LD_LIBRARY_PATH=$foam_library_path" \
            "$python_path" -B tools/run_frozen_rotor_phase.py \
            --baseline-case-directory "$RUNNER_TEMP/frozen-baseline" \
            --baseline-evidence-json "$RUNNER_TEMP/frozen-baseline/native-baseline-reduction.json" \
            --output-directory "$RUNNER_TEMP/frozen-phase-case" \
            --pressure-absolute-pa "$PRESSURE_ABSOLUTE_PA" --mode "$PHASE_MODE" \
            --time-step-s "$TIME_STEP_S" --duration-s "$DURATION_S"
      - name: Reduce actual phase observations with independent numerical gates
        run: python -B tools/frozen_rotor_phase_reduction.py --execution-directory "$RUNNER_TEMP/frozen-phase-case"
      - name: Retain actual phase reports and native evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frozen-rotor-phase-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/frozen-phase-case/phase-change-preparation.json
            ${{ runner.temp }}/frozen-phase-case/phase-change-execution.json
            ${{ runner.temp }}/frozen-phase-case/phase-runtime-identity.json
            ${{ runner.temp }}/frozen-phase-case/geometry-identity.json
            ${{ runner.temp }}/frozen-phase-case/phase-input-manifest.json
            ${{ runner.temp }}/frozen-phase-case/phase-classroom-study.json
            ${{ runner.temp }}/frozen-phase-case/phase-native-reduction.json
            ${{ runner.temp }}/frozen-phase-case/logs/*.log
            ${{ runner.temp }}/frozen-phase-case/case/**
          if-no-files-found: error
          retention-days: 1
